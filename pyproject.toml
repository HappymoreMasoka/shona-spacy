@'
[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shona-spacy"
version = "0.1.0"
description = "A rule-based spaCy pipeline for Shona NLP with JSON lexicon lookup."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Happymore Masoka", email = "happymoremasoka@example.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic"
]
dependencies = [
    "spacy>=3.7"
]

[project.urls]
Homepage = "https://github.com/HappymoreMasoka/shona-spacy"
Repository = "https://github.com/HappymoreMasoka/shona-spacy"

[tool.setuptools.packages.find]
where = ["shona_spacy"]

[tool.setuptools.package-data]
"shona_spacy" = ["data/*.json"]
'@ | Set-Content -Encoding UTF8 pyproject.toml